name: MentalHeroes bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Plugin und Resourcepack bauen
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Plugin bauen
        run: gradle clean build --no-daemon

      - name: Version und Dateinamen ermitteln
        id: version
        shell: bash
        run: |
          set -euo pipefail
          HERO_JAR=$(find build/libs -maxdepth 1 -type f -name 'MentalHeroes-*.jar' | head -n1)
          test -n "$HERO_JAR"
          HERO_FILE=$(basename "$HERO_JAR")
          HERO_VERSION=${HERO_FILE#MentalHeroes-}
          HERO_VERSION=${HERO_VERSION%.jar}
          echo "jar=$HERO_JAR" >> "$GITHUB_OUTPUT"
          echo "file=$HERO_FILE" >> "$GITHUB_OUTPUT"
          echo "version=$HERO_VERSION" >> "$GITHUB_OUTPUT"
          echo "resourcepack=MentalHeroes-Resourcepack-$HERO_VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Resourcepack bauen
        working-directory: resourcepack
        run: zip -r "../${{ steps.version.outputs.resourcepack }}" .

      - name: Plugin speichern
        uses: actions/upload-artifact@v4
        with:
          name: MentalHeroes-${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.jar }}
          if-no-files-found: error

      - name: Resourcepack speichern
        uses: actions/upload-artifact@v4
        with:
          name: MentalHeroes-Resourcepack-${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.resourcepack }}
          if-no-files-found: error

      - name: Direkten MentalHeroes Download aktualisieren
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete mentalheroes-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create mentalheroes-latest \
            "${{ steps.version.outputs.jar }}" \
            "${{ steps.version.outputs.resourcepack }}" \
            --target "$GITHUB_SHA" \
            --title "MentalHeroes ${{ steps.version.outputs.version }}" \
            --notes "Automatically built current MentalHeroes download." \
            --latest

      - name: Download im Summary anzeigen
        shell: bash
        run: |
          {
            echo "# ✅ MentalHeroes Downloads"
            echo ""
            echo "- [⬇️ MentalHeroes ${{ steps.version.outputs.version }}](https://github.com/${GITHUB_REPOSITORY}/releases/download/mentalheroes-latest/${{ steps.version.outputs.file }})"
            echo "- [⬇️ MentalHeroes Resourcepack ${{ steps.version.outputs.version }}](https://github.com/${GITHUB_REPOSITORY}/releases/download/mentalheroes-latest/${{ steps.version.outputs.resourcepack }})"
          } >> "$GITHUB_STEP_SUMMARY"
