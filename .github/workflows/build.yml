name: MentalHeroes bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Plugin und Resourcepack bauen
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Plugin bauen
        run: gradle clean build --no-daemon

      - name: Resourcepack bauen
        working-directory: resourcepack
        run: zip -r ../MentalHeroes-Resourcepack.zip .

      - name: Plugin speichern
        uses: actions/upload-artifact@v4
        with:
          name: MentalHeroes-Plugin
          path: build/libs/MentalHeroes-*.jar
          if-no-files-found: error

      - name: Resourcepack speichern
        uses: actions/upload-artifact@v4
        with:
          name: MentalHeroes-Resourcepack
          path: MentalHeroes-Resourcepack.zip
          if-no-files-found: error

      - name: Direkten MentalHeroes Download aktualisieren
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HERO_JAR=$(find build/libs -maxdepth 1 -type f -name 'MentalHeroes-*.jar' | head -n1)
          test -n "$HERO_JAR"
          cp "$HERO_JAR" MentalHeroes.jar

          gh release delete mentalheroes-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create mentalheroes-latest \
            MentalHeroes.jar \
            MentalHeroes-Resourcepack.zip \
            --target "$GITHUB_SHA" \
            --title "MentalHeroes Latest Build" \
            --notes "Automatisch gebauter aktueller MentalHeroes Download." \
            --latest

      - name: Download im Summary anzeigen
        shell: bash
        run: |
          {
            echo "# ✅ MentalHeroes Downloads"
            echo ""
            echo "- [⬇️ MentalHeroes](https://github.com/${GITHUB_REPOSITORY}/releases/download/mentalheroes-latest/MentalHeroes.jar)"
            echo "- [⬇️ MentalHeroes Resourcepack](https://github.com/${GITHUB_REPOSITORY}/releases/download/mentalheroes-latest/MentalHeroes-Resourcepack.zip)"
          } >> "$GITHUB_STEP_SUMMARY"
