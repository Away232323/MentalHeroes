combat:
  start-seconds: 30
  hits-per-extension: 5
  extension-seconds: 20
  maximum-seconds: 150

  # Prevents players from escaping combat by logging out
  logout-loses-heart: true

hearts:
  maximum: 3
  starting-hearts: 3

grappling-hook:
  # Maximum flight distance of the grappling hook
  max-distance: 25.0
  max-lifetime-ticks: 1200

  # Flight and pulling speed
  projectile-speed: 2.25
  maximum-pull-speed: 2.20
  base-pull-speed: 0.72
  pull-speed-per-block: 0.055
  # Roughly two blocks of height when the hook attaches
  attachment-upward-boost: 0.55
  vertical-boost: 0.22
  maximum-vertical-pull-speed: 1.80

pvp:
  # Keep this disabled during the first three server days.
  # Operators can change it at any time with /pvp on or /pvp off.
  enabled: false

playtime:
  # Keep this enabled during the first three server days.
  # Operators can later remove the limit with /playtime disable.
  enabled: true
  daily-seconds: 3600
  reset-timezone: "Europe/Vienna"

apple-drops:
  # 10% base chance: about one extra apple per 10 broken leaves.
  base-chance: 0.10
  fortune-bonus-per-level: 0.015

ban:
  reason: "<red><bold>You have lost all of your Hero Hearts!</bold></red>"

messages:
  prefix: "<dark_aqua><bold>MentalHeroes</bold></dark_aqua> <dark_gray>»</dark_gray> "

  no-permission: "<red>You do not have permission to do that.</red>"
  player-not-found: "<red>That player could not be found.</red>"
  invalid-number: "<red>Hearts must be between 0 and 3.</red>"

  own-hearts: "<gray>You currently have <aqua><hearts></aqua> hearts.</gray>"
  other-hearts: "<gray><player> currently has <aqua><hearts></aqua> hearts.</gray>"
  hearts-set: "<green>Set <player>'s hearts to <hearts>.</green>"
  hearts-received: "<green>Your hearts were set to <hearts>.</green>"

  heart-lost: "<red>You lost a blue heart! Remaining: <hearts></red>"
  combat-ended: "<green>You are no longer in combat.</green>"
