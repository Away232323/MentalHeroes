name: MentalHeroes
version: 1.5.1
main: de.away.mentalheroes.MentalHeroesPlugin
api-version: '1.21.6'
author: Away
description: Hero hearts, combat, and grappling hooks for Paper 1.21.6

commands:
  mentalheroes:
    description: Main MentalHeroes command
    usage: /mentalheroes <hearts|sethearts|grappler>
    aliases:
      - mh

  pvp:
    description: Enables, disables, or checks global PvP
    usage: /pvp <on|off|status>

  playtime:
    description: Controls the daily playtime limit and boss bar
    usage: /playtime <show|hide|enable|disable|set|status>

permissions:
  mentalheroes.command.hearts:
    description: Allows players to view their own hearts
    default: true

  mentalheroes.command.hearts.others:
    description: Allows players to view other players' hearts
    default: true

  mentalheroes.command.sethearts:
    description: Allows setting player hearts
    default: op

  mentalheroes.command.grappler:
    description: Allows giving grappling hooks by command
    default: op

  mentalheroes.command.pvp:
    description: Allows changing the global PvP state
    default: op

  mentalheroes.command.playtime:
    description: Allows showing or hiding the personal playtime boss bar
    default: true

  mentalheroes.command.playtime.admin:
    description: Allows enabling or disabling the daily playtime limit
    default: op
